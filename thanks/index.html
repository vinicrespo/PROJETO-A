<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HorseFil — Order Confirmed</title>
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#f5f5f5;
    --muted:#a3a3a3;
    --dim:#737373;
    --green:#22c55e;
    --panel:#1a1a1a;
    --line:#333;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wrap{
    width:100%;
    max-width:520px;
    padding:32px 20px;
    margin:0 auto;
    text-align:center;
  }

  .check{
    width:80px;
    height:80px;
    margin:0 auto;
    border-radius:50%;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 34px rgba(34,197,94,.35);
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .check svg{width:40px;height:40px;fill:none;stroke:#062b14;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.check{animation:none}}

  h1{
    margin-top:24px;
    font-size:28px;
    font-weight:800;
    line-height:1.25;
    letter-spacing:-.4px;
  }

  .msg{
    margin-top:16px;
    font-size:16px;
    line-height:1.6;
    color:var(--muted);
  }
  .msg p + p{margin-top:12px}


  .closing{
    margin-top:32px;
    font-size:14px;
    line-height:1.6;
    color:var(--dim);
  }

  @media (min-width:768px){
    h1{font-size:32px}
    .msg{font-size:17px}
  }
</style>

  </div>

  <h1>Thank you for your purchase!</h1>
