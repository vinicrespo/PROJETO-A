<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Nerve Recovery App</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#4B9CF5;--pri-d:#2E78D2;--pri-l:#EBF4FF;--acc:#E8A838;--acc-l:#FEF4E4;--bg:#F7F9FC;--card:#fff;--txt:#1a1a1a;--txt-l:#6B7280;--txt-m:#9CA3AF;--red:#DC2626;--green:#16A34A;--blue:#3B82F6;--purple:#7C3AED;--orange:#EA580C;--rose:#E11D48;--radius:16px;--shadow:0 1px 3px rgba(0,0,0,.06)}
body{background:var(--bg);font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:0;background:transparent}
.app-shell{min-height:100vh;max-width:430px;margin:0 auto;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
.page{padding:20px;padding-bottom:100px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #f0f0f0;display:flex;justify-content:space-around;align-items:center;padding:6px 8px 10px;z-index:50}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px;border-radius:12px;cursor:pointer;transition:.2s;color:var(--txt-m);text-decoration:none;-webkit-tap-highlight-color:transparent}
.nav-item.active{color:var(--pri)}
.nav-item.active .nav-icon-wrap{background:var(--pri-l)}
.nav-icon-wrap{padding:6px;border-radius:10px;transition:.2s;display:flex;align-items:center;justify-content:center}
.nav-label{font-size:8px;font-weight:700;white-space:nowrap}
.nav-item svg{width:20px;height:20px}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);border:1px solid #f0f0f0;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-sm{padding:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:12px;font-weight:700;font-size:15px;border:none;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(75,156,245,.25)}
.btn-pri:hover{background:var(--pri-d)}
.btn-outline{background:var(--pri-l);color:var(--pri);border:1px solid rgba(75,156,245,.2)}
.btn-block{width:100%}
.btn-sm{padding:10px 20px;font-size:13px}

/* Tags */
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}

/* Inputs */
input[type="email"],input[type="text"],input[type="number"]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #e5e7eb;font-size:15px;font-family:inherit;outline:none;transition:.2s;background:#fff}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(75,156,245,.12)}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

/* Utility */
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.text-center{text-align:center}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-5{margin-bottom:20px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}
.text-xs{font-size:11px}.text-sm{font-size:13px}.text-base{font-size:15px}.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:26px}
.font-bold{font-weight:700}.font-black{font-weight:900}.font-medium{font-weight:500}.font-semibold{font-weight:600}
.text-pri{color:var(--pri)}.text-acc{color:var(--acc)}.text-light{color:var(--txt-l)}.text-muted{color:var(--txt-m)}.text-white{color:#fff}
.rounded-full{border-radius:9999px}.rounded-xl{border-radius:12px}.rounded-2xl{border-radius:16px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.leading-relaxed{line-height:1.65}
.tracking-wide{letter-spacing:.5px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* Specific */
.hero-gradient{background:linear-gradient(135deg,var(--pri) 0%,var(--pri-d) 100%)}
.acc-gradient{background:linear-gradient(135deg,#FEF4E4,var(--pri-l))}
.dark-card{background:linear-gradient(135deg,#2D2D2D,#1a1a1a);color:#fff;border:1px solid #333}
.progress-ring{width:10px;height:10px;border-radius:50%;display:inline-block}
.calendar-day{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;border:none;background:#f3f4f6;color:var(--txt-m)}
.calendar-day.completed{background:var(--pri);color:#fff}
.calendar-day.selected{border:2px solid var(--acc);color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(232,168,56,.12)}
.calendar-day.completed.selected{background:var(--pri);color:#fff;box-shadow:0 0 0 3px rgba(75,156,245,.2)}
.pain-bar{flex:1;height:32px;border-radius:8px;transition:.3s}
.pain-bar.filled{background:var(--pri)}
.pain-bar.empty{background:#ebf4ff;border:1px solid #c5dcf7}
.habit-btn{padding:14px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;cursor:pointer;transition:.2s;background:#f9fafb}
.habit-btn.active{background:var(--pri-l);border-color:rgba(75,156,245,.3)}
.upgrade-card{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:14px;border:1px solid;cursor:pointer;transition:.2s;background:none;text-align:left}
.upgrade-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--txt-l);cursor:pointer;padding:4px 0;border:none;background:none;margin-bottom:16px;font-family:inherit}
.back-btn:hover{color:var(--txt)}
.modal-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);animation:fadeIn .3s}
.modal-box{background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:scaleIn .3s;max-width:360px;margin:16px;max-height:80vh;overflow-y:auto}
.section-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;border:none;background:none;font-family:inherit;text-align:left}

/* Confetti */
.confetti-piece{position:fixed;top:-20px;width:10px;height:10px;border-radius:2px;animation:confetti 2.5s linear forwards;z-index:100;pointer-events:none}

/* Chat */
.chat-fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(75,156,245,.35);display:flex;align-items:center;justify-content:center;z-index:60;transition:.2s}
.chat-fab:hover{transform:scale(1.08)}
.chat-panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:70vh;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.12);z-index:70;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
.chat-messages{flex:1;overflow-y:auto;padding:16px}
.chat-bubble{max-width:85%;padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.5;margin-bottom:8px}
.chat-bubble.bot{background:var(--pri-l);color:var(--txt);border-bottom-left-radius:4px;align-self:flex-start}
.chat-option{display:block;width:100%;text-align:left;padding:10px 14px;margin:4px 0;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;color:var(--txt)}
.chat-option:hover{background:var(--pri-l);border-color:var(--pri)}

/* Top bar */
.top-bar{background:linear-gradient(90deg,var(--pri),var(--pri-d));padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.top-bar p{font-size:11px;color:#fff;font-weight:600;letter-spacing:.3px}

/* Symptom severity */
.severity-btn{width:100%;padding:8px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:11px;font-weight:600;transition:.2s;font-family:inherit}
.severity-btn.s0{color:var(--txt-m)}
.severity-btn.s1{background:#fef9c3;border-color:#fde047;color:#854d0e}
.severity-btn.s2{background:#fed7aa;border-color:#fb923c;color:#9a3412}
.severity-btn.s3{background:#fecaca;border-color:#f87171;color:#991b1b}
</style>
</head>
<body>
<div class="app-shell" id="app"></div>

<script>
(function(){
'use strict';

// ============================================================

const IC = {

  activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  award: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',

function icon(name, size=20) {
  return `<span style="display:inline-flex;width:${size}px;height:${size}px">${IC[name]||''}</span>`;
}

// ============================================================
// STORAGE
// ============================================================
const PREFIX = 'nr_';
const getEmail = () => localStorage.getItem(PREFIX+'email') || 'default';
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(PREFIX+key+'_'+getEmail())); } catch { return null; } },
  set(key, val) { localStorage.setItem(PREFIX+key+'_'+getEmail(), JSON.stringify(val)); },
  getGlobal(key) { try { return JSON.parse(localStorage.getItem(PREFIX+key)); } catch { return null; } },
  setGlobal(key, val) { localStorage.setItem(PREFIX+key, JSON.stringify(val)); }
};

function getProfile() { return store.get('profile'); }
function saveProfile(d) { store.set('profile', d); }
function getProgress() {
  const d = store.get('progress');
  if (d) {
    if (!d.completedDays) d.completedDays = [];
    if (!d.dailyHabits) d.dailyHabits = {};
    if (!d.badges) d.badges = [];
    return d;
  }
  return { currentDay:1, streak:0, completedDays:[], dailyHabits:{}, badges:[], phase:1 };
}
function saveProgress(d) { store.set('progress', d); }
function toggleDay(day) {
  const p = getProgress();
  if (p.completedDays.includes(day)) {
    p.completedDays = p.completedDays.filter(d=>d!==day);
  } else {
    p.completedDays.push(day);
    const sorted = [...p.completedDays].sort((a,b)=>a-b);
    let s=1; for(let i=sorted.length-1;i>0;i--){if(sorted[i]-sorted[i-1]===1)s++;else break;} p.streak=s;
    checkBadges(p);
  }
  saveProgress(p);
  return p;

window.handleLogin = function(e) {
  e.preventDefault();
  const email = document.getElementById('authEmail').value;
  if (!email.includes('@')) return;
  localStorage.setItem(PREFIX+'email', email);
  state.onboardStep = 1;
  state.onboardData = {name:'',age:'',weight:'',height:''};
  state.onboardFlags = {};
  render();
};

window.onboardNext = function(step) {
  if (step === 1) {
    const name = document.getElementById('obName')?.value||'';
    if (!name.trim()) return;
    state.onboardData.name = name;
    state.onboardStep = 2;
  } else if (step === 2) {
    const age = document.getElementById('obAge')?.value||'';
    const weight = document.getElementById('obWeight')?.value||'';
    const height = document.getElementById('obHeight')?.value||'';
    if (!age || !weight) return;
    state.onboardData.age = age;
    state.onboardData.weight = weight;
    state.onboardData.height = height;
    state.onboardStep = 3;
  }
  render();
};

window.onboardBack = function() {
  state.onboardStep = Math.max(1, (state.onboardStep||1) - 1);
  render();
};

window.toggleOnboardFlag = function(id) {
  if (!state.onboardFlags) state.onboardFlags = {};
  state.onboardFlags[id] = !state.onboardFlags[id];
  render();
};

window.finishOnboarding = function() {
  saveProfile({...state.onboardData, flags:state.onboardFlags||{}});
  saveProgress({currentDay:1,streak:0,completedDays:[],dailyHabits:{},badges:[],phase:1});
  currentPage = 'dashboard';
  render();
};

window.adjustPain = function(dir) {

  const next = Math.max(0, Math.min(10, cur+dir));
