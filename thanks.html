<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Emma</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, #E8F5EE 0%, #FAFAF5 50%, #FFFFFF 100%);
  }
  .container { max-width: 380px; width: 100%; text-align: center; }
  .check {
    width: 72px; height: 72px; border-radius: 50%;
    background: #2ECC71; margin: 0 auto 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(46,204,113,0.25);
    animation: scaleIn 0.5s ease-out;
  }
  .check svg { width: 32px; height: 32px; }
  .logo {
    margin: 0 auto 32px;
    animation: scaleIn 0.5s ease-out 0.15s both;
  }
  .logo img { width: 140px; height: auto; }
  h1 {
    font-size: 22px; font-weight: 700; color: #1A1A1A;
    margin-bottom: 8px; line-height: 1.3;
    animation: fadeUp 0.5s ease-out 0.3s both;
  }
  .subtitle {
    font-size: 14px; color: #8B8B8B; line-height: 1.5;
    margin-bottom: 6px;
    animation: fadeUp 0.5s ease-out 0.4s both;
  }
  .hint {
    font-size: 12px; color: #C5C5BE; line-height: 1.5;
    margin-bottom: 36px;
    animation: fadeUp 0.5s ease-out 0.45s both;
  }
  .cta {
    display: block; width: 100%;
    padding: 16px; border-radius: 14px;
    background: #1B6B4A; color: white;
    font-size: 15px; font-weight: 600;
    text-decoration: none; text-align: center;
    box-shadow: 0 6px 16px rgba(27,107,74,0.2);
    transition: transform 0.15s;
    animation: fadeUp 0.5s ease-out 0.55s both, pulse 2s ease-in-out 1.5s infinite;
  }
  .cta:active { transform: scale(0.98); }
  .footer {
    font-size: 11px; color: #C5C5BE; margin-top: 28px;
    animation: fadeUp 0.5s ease-out 0.7s both;
  }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 16px rgba(27,107,74,0.2); } 50% { box-shadow: 0 6px 24px rgba(46,204,113,0.35); } }
</style>
</head>
<body>
  <div class="container">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="logo">
      <img src="/app/logo.png" alt="Emma">
    </div>
    <h1>Thank You for Your Purchase!</h1>
    <p class="subtitle">Your 90-day gut health protocol is ready.</p>
    <p class="hint">Tap the button below to set up your account and start your healing journey.</p>
    <a href="/app" class="cta">Enter the App →</a>
    <p class="footer">Having trouble? Contact support@emmagut.com</p>
  </div>
</body>
</html>
