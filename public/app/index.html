<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>HorseFil</title>
<style>
  :root{
    --bg:#0a0a0a; --card:#141414; --raise:#1a1a1a; --line:#2a2a2a;
    --fg:#f5f5f5; --fg2:#a3a3a3; --fg3:#737373;
    --green:#22c55e; --green-d:#16a34a; --yellow:#facc15; --red:#ef4444; --blue:#3b82f6;
    --r-card:12px; --r-btn:8px; --t:.2s ease;
    --nav-h:64px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; min-height:100vh;
  }
  button,input,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  a{color:var(--blue);text-decoration:none}

  /* ---------- logo placeholder ---------- */
  .logo{
    display:flex;align-items:center;justify-content:center;
    width:84px;height:84px;border-radius:var(--r-card);
    background:var(--raise);border:1px dashed var(--line);
    color:var(--fg3);font-size:11px;font-weight:800;letter-spacing:2px;
  }
  .logo.sm{width:34px;height:34px;font-size:8px;letter-spacing:1px;border-radius:8px}

  /* ---------- shared ---------- */
  .center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
  h1{font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.4px}
  h2{font-size:19px;font-weight:700;line-height:1.3}
  h3{font-size:15px;font-weight:700}
  .muted{color:var(--fg2)}
  .dim{color:var(--fg3)}
  .small{font-size:13px}
  .tiny{font-size:11.5px}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:48px;padding:12px 18px;border-radius:var(--r-btn);
    background:var(--green);color:#052e13;font-weight:800;font-size:15px;
    transition:background var(--t),opacity var(--t),transform var(--t);
  }
  .btn:hover{background:var(--green-d)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{background:var(--line);color:var(--fg3);cursor:default}
  .btn.ghost{background:var(--raise);color:var(--fg);border:1px solid var(--line)}
  .btn.ghost:hover{background:#202020}
  .btn.danger{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.4)}

  .input{
    width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-btn);
    background:var(--raise);border:1px solid var(--line);color:var(--fg);
    transition:border-color var(--t);
  }
  .input:focus{outline:none;border-color:var(--green)}
  .input::placeholder{color:var(--fg3)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
  .card.raise{background:var(--raise)}

  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}

  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--green);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .fade{animation:fadeUp .3s ease both}
  .slide{animation:slideIn .28s ease both}

  /* ---------- app shell ---------- */
  #app{min-height:100vh}
  .shell{display:flex;min-height:100vh}
  .side{display:none}
  .main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + 20px)}

  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar .t{font-weight:700;font-size:15px}
  .iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-btn);color:var(--fg2);transition:background var(--t),color var(--t)}
  .iconbtn:hover{background:var(--raise);color:var(--fg)}

  .page{padding:16px;max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  /* bottom nav */
  .bnav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(10,10,10,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bnav button{
    min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--fg3);font-size:10.5px;font-weight:600;transition:color var(--t);
  }
  .bnav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bnav button.on{color:var(--green)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;animation:fadeUp .2s ease both}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:268px;z-index:41;
    background:var(--card);border-left:1px solid var(--line);
    padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
    animation:slideIn .22s ease both;
  }
  .drawer a,.drawer button{
    display:block;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r-btn);
    color:var(--fg2);font-size:14px;font-weight:600;transition:background var(--t),color var(--t);
  }
  .drawer button:hover{background:var(--raise);color:var(--fg)}
  .drawer .sep{height:1px;background:var(--line);margin:8px 0}

  /* grids */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid1{display:grid;gap:12px}

  .quick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);transition:border-color var(--t),transform var(--t);text-align:left}
  .quick:hover{border-color:#3a3a3a;transform:translateY(-2px)}
  .quick .ic{font-size:20px}
  .quick .lb{font-size:13.5px;font-weight:700}

  /* week dots */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .dot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--raise);color:var(--fg3);border:1px solid var(--line)}
  .dot.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.45);color:var(--green)}
  .dot.miss{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:var(--red)}
  .dot.now{border-color:var(--green);color:var(--green);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.35)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}

  /* option buttons */
  .opt{
    width:100%;text-align:left;padding:14px 16px;min-height:52px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn);
    color:var(--fg);font-weight:600;transition:border-color var(--t),background var(--t);
  }
  .opt:hover{border-color:#3a3a3a}
  .opt.sel{border-color:var(--green);background:rgba(34,197,94,.1)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .scale button{aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:16px;transition:var(--t)}
  .scale button.sel{border-color:var(--green);background:rgba(34,197,94,.14);color:var(--green)}

  /* accordion */
  .acc{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--card)}
  .acc + .acc{margin-top:10px}
  .acc > .hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;text-align:left;font-weight:700;font-size:14.5px}
  .acc > .bd{padding:0 16px 16px;color:var(--fg2);font-size:14px}
  .acc > .bd p + p{margin-top:10px}
  .acc .chev{color:var(--fg3);transition:transform var(--t);flex-shrink:0}
  .acc.open .chev{transform:rotate(180deg)}

  ul.list{list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.list li{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--fg2)}
  ul.list li::before{content:"";flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:8px}
  ul.list.no li::before{background:var(--red)}

  /* timer */
  .timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-card)}
  .timer .num{font-size:44px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;color:var(--green)}

  /* modal */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72)}
  .modal .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .22s ease both}

  .lock{opacity:.72}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .badge.new{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.locked{background:var(--raise);color:var(--fg3)}

  /* live GPS mode */
  .gps{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:26px}
  .gps .step{font-size:23px;font-weight:700;line-height:1.4;max-width:520px}
  .gps .num{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-2px}
  .gps .meta{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#666}
  .gps .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .gps .row button{padding:12px 18px;border-radius:var(--r-btn);border:1px solid #333;color:#ddd;font-weight:700;font-size:14px}

  /* chart */
  .chart{width:100%;height:190px}
  .chart .grid{stroke:#222;stroke-width:1}
  .chart .avg{stroke:#555;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
  .chart .you{stroke:var(--green);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}

  /* confetti */
  .confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;width:8px;height:14px;opacity:.9;animation:fall 1.5s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* ---------- desktop ---------- */
  @media (min-width:1024px){
    body{font-size:16px}
    .bnav{display:none}
    .main{padding-bottom:24px}
    .side{
      display:flex;flex-direction:column;gap:3px;
      width:236px;flex-shrink:0;padding:18px 12px;
      background:var(--card);border-right:1px solid var(--line);
      position:sticky;top:0;height:100vh;overflow-y:auto;
    }
    .side .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
    .side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-btn);color:var(--fg2);font-size:14px;font-weight:600;transition:background var(--t),color var(--t)}
    .side button:hover{background:var(--raise);color:var(--fg)}
    .side button.on{background:rgba(34,197,94,.1);color:var(--green)}
    .side .sep{height:1px;background:var(--line);margin:8px 4px}
    .topbar .iconbtn.menu{display:none}
    .page{padding:24px}
    .grid2{grid-template-columns:repeat(4,1fr)}
  }
  @media (min-width:768px) and (max-width:1023px){
    .page{padding:20px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="content.js"></script>
<script src="library.js"></script>
<script src="modules.js"></script>
<script src="app.js"></script>
</body>
</html>
