<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HorseFil — Complete Your Order</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --muted:#8b8b8b;
    --line:#242424;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  /* 3. heading */
  h1 .hl{
    background:#e01b1b;
    color:#fff;
    padding:0 .18em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  h1{
    max-width:720px;
    text-align:center;
    font-size:28px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:-.4px;
    text-transform:uppercase;
  }

  /* 4. video */
  .video{
    width:100%;
    max-width:min(420px,46vh);
    aspect-ratio:1000/1674;
    background:#000;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video > iframe,
  .video > video,
  .video > vturb-smartplayer{width:100%;max-width:none;height:100%;border:0;display:block}
  .video .vturb-player-placeholder{padding-top:0!important;height:100%}
  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    pointer-events:none;
  }
  .placeholder svg{width:64px;height:64px;fill:#fff;opacity:.5}
  .placeholder span{font-size:12px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

  /* 5. area reservada para os botoes de checkout */
  .checkout-buttons-area{
    width:100%;
    max-width:800px;
    min-height:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  /* tablet */
  @media (min-width:768px){
    .page{gap:24px;padding:28px 16px 48px}
    h1{font-size:34px}
    .video{max-width:min(420px,46vh)}
  }
  /* desktop */
  @media (min-width:1025px){
    h1{font-size:38px}
    .video{max-width:min(420px,40vh)}
  }
</style>
</head>
<body>

<main class="page">

  <h1>See when you will <span class="hl">gain access</span> to your product 👇</h1>

  <div class="video">
    <vturb-smartplayer id="vid-6aa83183674fc27e0646dd38" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 167.4074074074074% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer> <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/d21a9e1d-910e-4254-b2bc-30b12586d2ef/players/6aa83183674fc27e0646dd38/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
  </div>

  <!-- INSERIR BOTÕES DE CHECKOUT ONE-CLICK AQUI -->
  <div class="checkout-buttons-area" id="cta-buttons"></div>

</main>

<script>
  // mantem o visitante na pagina ao usar o botao voltar
  (function () {
    try {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
    } catch (e) {}
  })();
</script>

</body>
</html>
