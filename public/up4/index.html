<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HorseFil — Super Discount</title>
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#f5f5f5;
    --dim:#737373;
    --yellow:#facc15;
    --green:#22c55e;
    --card:#141414;
    --line:#333;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wrap{width:100%;max-width:600px;padding:26px 20px 30px;margin:0 auto}

  h1{
    text-align:center;
    text-transform:uppercase;
    font-size:25px;
    font-weight:900;
    line-height:1.22;
    letter-spacing:-.3px;
    color:var(--yellow);
    text-shadow:0 0 22px rgba(250,204,21,.28);
    margin-bottom:22px;
  }
  h1 span{display:block}

  /* cards */
  .stack{display:flex;flex-direction:column;align-items:center;gap:8px}
  .card{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    text-align:center;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    animation:rise .45s ease-out both;
  }
  .card:nth-of-type(1){animation-delay:.05s}
  .card:nth-of-type(2){animation-delay:.2s}
  .card:nth-of-type(3){animation-delay:.35s}
  .card b{
    display:block;
    font-size:38px;
    font-weight:900;
    line-height:1;
    letter-spacing:-1.5px;
    color:var(--green);
  }
  .card em{
    display:block;
    margin-top:5px;
    font-style:normal;
    font-size:13px;
    font-weight:700;
    letter-spacing:2.4px;
    text-transform:uppercase;
    color:var(--fg);
  }
  .card.gtee{
    background:linear-gradient(180deg,rgba(250,204,21,.13),rgba(250,204,21,.04));
    border-color:var(--yellow);
    box-shadow:0 0 22px rgba(250,204,21,.18);
    animation:rise .45s ease-out both,gGlow 2.6s ease-in-out infinite 1s;
  }
  .card.gtee b{color:var(--yellow);font-size:30px;white-space:nowrap;text-shadow:0 0 16px rgba(250,204,21,.35)}
  .card.gtee em{color:#f0e2a8}
  .card.gtee .sh{display:block;font-size:22px;line-height:1;margin-bottom:4px}
  @keyframes gGlow{
    0%,100%{box-shadow:0 0 22px rgba(250,204,21,.18)}
    50%{box-shadow:0 0 34px rgba(250,204,21,.36)}
  }
  .plus{
    font-size:28px;
    font-weight:900;
    line-height:1;
    color:var(--yellow);
    animation:rise .45s ease-out both;
  }
  .plus:nth-of-type(1){animation-delay:.125s}
  .plus:nth-of-type(2){animation-delay:.275s}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .card,.plus{animation:none}
  }

  /* oferta */
  .offer{
    margin-top:20px;
    background:#111;
    border:1px solid rgba(250,204,21,.28);
    border-radius:12px;
    padding:24px 20px;
    text-align:center;
  }
  .offer-lead{
    text-transform:uppercase;
    font-size:14px;
    font-weight:800;
    line-height:1.5;
    letter-spacing:.3px;
  }
  .offer-cta{
    margin-top:11px;
    text-transform:uppercase;
    font-size:13px;
    font-weight:800;
    letter-spacing:1.4px;
    color:#c9c9c9;
  }

  /* selo da garantia */
  .warranty{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:16px auto 0;
    padding:12px 18px;
    border-radius:999px;
    background:linear-gradient(180deg,rgba(250,204,21,.16),rgba(250,204,21,.06));
    border:1.5px solid var(--yellow);
    box-shadow:0 0 26px rgba(250,204,21,.22),inset 0 0 18px rgba(250,204,21,.07);
    animation:pulseW 2.4s ease-in-out infinite;
  }
  .warranty .shield{font-size:27px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  .warranty .wtxt{text-align:left;line-height:1.1}
  .warranty b{
    display:block;
    font-size:25px;
    font-weight:900;
    letter-spacing:-.5px;
    color:var(--yellow);
    text-shadow:0 0 16px rgba(250,204,21,.4);
  }
  .warranty em{
    display:block;
    margin-top:2px;
    font-style:normal;
    font-size:10.5px;
    font-weight:800;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color:#f0e2a8;
  }
  @keyframes pulseW{
    0%,100%{box-shadow:0 0 26px rgba(250,204,21,.22),inset 0 0 18px rgba(250,204,21,.07)}
    50%{box-shadow:0 0 38px rgba(250,204,21,.42),inset 0 0 22px rgba(250,204,21,.12)}
  }

  .offer .amount{
    display:block;
    margin-top:10px;
    font-size:60px;
    font-weight:900;
    line-height:1;
    letter-spacing:-2.5px;
    color:var(--green);
    text-shadow:0 0 26px rgba(34,197,94,.35);
  }

  .checkout-buttons-area{
    min-height:80px;
    margin-top:32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }


  /* compacta para caber em uma tela */
  @media (max-width:767px){
    .wrap{padding:12px 20px 14px}
    h1{font-size:22px;margin-bottom:11px}
    .stack{gap:6px}
    .card{padding:10px 16px}
    .card b{font-size:31px}
    .card.gtee b{font-size:24px}
    .card.gtee .sh{font-size:19px}
    .card em{font-size:12px;letter-spacing:2px;margin-top:3px}
    .plus{font-size:23px}
    .offer{margin-top:11px;padding:15px 16px}
    .offer-lead{font-size:13px}
    .warranty b{font-size:23px}
    .offer .amount{font-size:52px;margin-top:6px}
    .checkout-buttons-area{margin-top:20px}
  }
  /* telas baixas (iPhone SE e similares) */
  @media (max-height:700px){
    .wrap{padding:8px 20px 10px}
    h1{font-size:20px;margin-bottom:10px}
    .stack{gap:5px}
    .card{padding:7px 14px}
    .card b{font-size:28px}
    .card.gtee b{font-size:22px}
    .card.gtee .sh{font-size:17px}
    .card em{font-size:11px;margin-top:2px}
    .plus{font-size:19px}
    .offer{margin-top:8px;padding:11px 14px}
    .offer-lead{font-size:12px}
    .warranty{padding:9px 14px;margin-top:12px}
    .warranty b{font-size:20px}
    .warranty .shield{font-size:23px}
    .offer .amount{font-size:44px;margin-top:4px}
    .checkout-buttons-area{margin-top:14px;min-height:70px}
  }

  @media (min-width:768px){
    .wrap{padding:40px 20px}
    h1{font-size:38px;margin-bottom:30px}

    .stack{flex-direction:row;align-items:stretch;gap:12px}
    .card{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px 14px;
    }
    .card:hover{
      transform:translateY(-3px) scale(1.02);
      border-color:rgba(34,197,94,.55);
      box-shadow:0 10px 26px rgba(0,0,0,.5);
    }
    .card b{font-size:44px}
    .card.gtee b{font-size:25px;white-space:nowrap}
    .card.gtee .sh{font-size:26px}
    .plus{font-size:32px;align-self:center}

    .offer{margin-top:28px;padding:32px 24px}
    .offer-lead{font-size:17px}
    .warranty{padding:14px 24px;margin-top:20px}
    .warranty b{font-size:30px}
    .warranty .shield{font-size:32px}
    .warranty em{font-size:11.5px}
    .offer .amount{font-size:70px}
  }

  /* area do checkout */
  .checkout-buttons-area{gap:0}
  .checkout-buttons-area button{transition:background-color .18s ease,transform .18s ease}
  .checkout-buttons-area button:hover{background-color:#046b2c}
  .checkout-buttons-area button:active{transform:scale(.98)}
  .no-thanks{
    display:block;
    margin:22px auto 0;
    padding:10px 14px;
    background:none;
    border:0;
    font-family:inherit;
    font-size:14px;
    font-weight:400;
    color:#ffffff;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-thickness:1px;
    text-align:center;
    cursor:pointer;
    opacity:.75;
    transition:opacity .18s ease;
  }
  .no-thanks:hover,.no-thanks:focus-visible{opacity:1}
</style>
  <script src="https://checkout.kashpay.com.br/scripts/upsell-processor.js"></script>
</head>
<body>

<main class="wrap">

  <h1>
    <span>You have been</span>
    <span>selected for</span>
    <span>a super discount</span>
  </h1>

  <div class="stack">
    <div class="card"><b>7X</b><em>Accelerator</em></div>
    <div class="plus">+</div>
    <div class="card"><b>Orgasmic</b><em>Massage</em></div>
    <div class="plus">+</div>
    <div class="card"><b>Flood</b><em>Protocol</em></div>
    <div class="plus">+</div>
    <div class="card gtee"><span class="sh">🛡️</span><b>360-Day</b><em>Extended Guarantee</em></div>
  </div>

  <div class="offer">
    <p class="offer-lead">All three modules<br>plus the 360-day guarantee</p>

    <p class="offer-cta">All of it for just</p>
    <span class="amount">$15</span>
  </div>

  <!-- INSERIR BOTÃO DE CHECKOUT ONE-CLICK AQUI -->
  <div class="checkout-buttons-area" id="cta-buttons">
      <button type="button" onclick="acceptUpsell('https://checkout.kashpay.com.br/u/250381e9dcfe1908')" style="font-family: 'Poppins'; font-size: 18px; font-weight: 600; line-height: 1.3; color: #ffffff; background-color: #057932; border: none; border-radius: 10px; padding: 13px 7%; cursor: pointer; text-align: center; display: block; margin: auto;">Get Now</button>
      <a class="no-thanks" href="/thanks">No, Thanks!</a>
    </div>

</main>

<script>
  // mantem o visitante na pagina ao usar o botao voltar
  (function () {
    try {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
    } catch (e) {}
  })();
</script>

</body>
</html>
