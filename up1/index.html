<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HorseFil — Complete Your Order</title>
<style>
  :root{
    --bg:#0a0a0a;
    --fg:#ffffff;
    --muted:#8b8b8b;
    --green:#22c55e;
    --warn:#fbbf24;
    --line:#242424;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  /* 1. progresso */
  .progress{width:100%;max-width:800px}
  .progress-label{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
    font-size:14px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.2px;
  }
  .progress-label b{color:var(--green);font-size:17px;font-weight:700}
  .progress-track{
    height:8px;
    border-radius:999px;
    background:#1c1c1c;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0;
    border-radius:999px;
    background:var(--green);
    animation:fill 1.5s cubic-bezier(.22,.9,.3,1) forwards;
  }
  @keyframes fill{to{width:90%}}
  @media (prefers-reduced-motion:reduce){
    .progress-fill{animation:none;width:90%}
  }

  /* 2. aviso de sistema */
  .notice{
    max-width:640px;
    text-align:center;
    font-size:13.5px;
    font-weight:600;
    line-height:1.5;
    color:var(--warn);
    letter-spacing:.1px;
  }

  /* 3. heading */
  h1{
    max-width:720px;
    text-align:center;
    font-size:28px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:-.4px;
    text-transform:uppercase;
  }

  /* 4. video */
  .video{
    width:100%;
    max-width:min(420px,46vh);
    aspect-ratio:1000/1674;
    background:#000;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video > iframe,
  .video > video,
  .video > vturb-smartplayer{width:100%;max-width:none;height:100%;border:0;display:block}
  .video .vturb-player-placeholder{padding-top:0!important;height:100%}
  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    pointer-events:none;
  }
  .placeholder svg{width:64px;height:64px;fill:#fff;opacity:.5}
  .placeholder span{font-size:12px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

  /* 5. area reservada para os botoes de checkout */
  .checkout-buttons-area{
    width:100%;
    max-width:800px;
    min-height:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  /* tablet */
  @media (min-width:768px){
    .page{gap:24px;padding:28px 16px 48px}
    h1{font-size:34px}
    .notice{font-size:14px}
    .video{max-width:min(420px,46vh)}
    .progress{max-width:680px}
  }
  /* desktop */
  @media (min-width:1025px){
    h1{font-size:38px}
    .video{max-width:min(440px,48vh)}
    .progress{max-width:800px}
  }

  /* desktop: video ao lado do texto, para o botao nao cair abaixo da dobra */
  @media (min-width:1024px){
    .page{
      display:grid;
      grid-template-columns:min(360px,50vh) minmax(0,1fr);
      column-gap:48px;
      row-gap:18px;
      align-content:center;
      justify-content:center;
      max-width:1040px;
      min-height:100vh;
      padding:32px 24px;
    }
    .video{grid-column:1;grid-row:1 / span 4;align-self:center;width:100%;max-width:none}
    .progress{grid-column:2;grid-row:1;align-self:end;max-width:none}
    .notice{grid-column:2;grid-row:2;text-align:left;max-width:none}
    h1{grid-column:2;grid-row:3;text-align:left;max-width:none}
    .checkout-buttons-area{grid-column:2;grid-row:4;align-self:start;max-width:none}
  }
</style>
</head>
<body>

<main class="page">

  <div class="progress">
    <div class="progress-label">Only one step left… <b>90%</b></div>
    <div class="progress-track" role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" aria-label="Order progress">
      <div class="progress-fill"></div>
    </div>
  </div>

  <p class="notice">⚠️ Do not close or refresh this page, it may cause errors with your purchase...</p>

  <h1>Watch your first protocol step below 👇</h1>

  <div class="video">
    <vturb-smartplayer id="vid-6aa83197e25dd4d3c23f243e" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 167.4074074074074% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer> <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/d21a9e1d-910e-4254-b2bc-30b12586d2ef/players/6aa83197e25dd4d3c23f243e/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
  </div>

  <!-- INSERIR BOTÕES DE CHECKOUT ONE-CLICK AQUI -->
  <div class="checkout-buttons-area" id="cta-buttons"></div>

</main>

<script>
  // mantem o visitante na pagina ao usar o botao voltar
  (function () {
    try {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
    } catch (e) {}
  })();
</script>

</body>
</html>
