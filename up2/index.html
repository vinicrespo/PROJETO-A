<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HorseFil — Complete Your Order</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --muted:#8b8b8b;
    --line:#242424;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  /* 3. heading */
  h1 .hl{
    background:#e01b1b;
    color:#fff;
    padding:0 .18em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  h1{
    max-width:720px;
    text-align:center;
    font-size:28px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:-.4px;
    text-transform:uppercase;
  }

  /* 4. video */
  .video{
    width:100%;
    max-width:min(420px,46vh);
    aspect-ratio:9/16;
    background:#000;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video > iframe,
  .video > video,
  .video > vturb-smartplayer{width:100%;height:100%;border:0;display:block}
  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    pointer-events:none;
  }
  .placeholder svg{width:64px;height:64px;fill:#fff;opacity:.5}
  .placeholder span{font-size:12px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

  /* 5. area reservada para os botoes de checkout */
  .checkout-buttons-area{
    width:100%;
    max-width:800px;
    min-height:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  /* tablet */
  @media (min-width:768px){
    .page{gap:24px;padding:28px 16px 48px}
    h1{font-size:34px}
    .video{max-width:min(420px,46vh)}
  }
  /* desktop */
  @media (min-width:1025px){
    h1{font-size:38px}
    .video{max-width:min(440px,48vh)}
  }

  /* desktop: video ao lado do texto, para o botao nao cair abaixo da dobra */
  @media (min-width:1024px){
    .page{
      display:grid;
      grid-template-columns:min(360px,50vh) minmax(0,1fr);
      column-gap:48px;
      row-gap:18px;
      align-content:center;
      justify-content:center;
      max-width:1040px;
      min-height:100vh;
      padding:32px 24px;
    }
    .video{grid-column:1;grid-row:1 / span 3;align-self:center;width:100%;max-width:none}
    h1{grid-column:2;grid-row:1;align-self:end;text-align:left;max-width:none}
    .checkout-buttons-area{grid-column:2;grid-row:2;align-self:start;max-width:none}
  }
</style>
</head>
<body>

<main class="page">

  <h1>See when you will <span class="hl">gain access</span> to your product 👇</h1>

  <div class="video">
    <!-- ================================================================= -->
    <!-- INSERIR O EMBED DO VIDEO AQUI (iframe ou script do player)         -->
    <!-- Apague a div .placeholder abaixo ao colar o embed.                 -->
    <!-- ================================================================= -->
    <div class="placeholder">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span>Video embed goes here</span>
    </div>
  </div>

  <!-- INSERIR BOTÕES DE CHECKOUT ONE-CLICK AQUI -->
  <div class="checkout-buttons-area" id="cta-buttons"></div>

</main>

<script>
  // mantem o visitante na pagina ao usar o botao voltar
  (function () {
    try {
      history.pushState(null, '', location.href);
      window.addEventListener('popstate', function () {
        history.pushState(null, '', location.href);
      });
    } catch (e) {}
  })();
</script>

</body>
</html>
