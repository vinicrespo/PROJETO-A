<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --muted:#8b8b8b;
    --line:#242424;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  .page{
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  /* 3. heading */
  h1 .hl{
    background:#e01b1b;
    color:#fff;
    padding:0 .18em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  h1{
    max-width:720px;
    text-align:center;
    font-size:28px;
    font-weight:800;
    line-height:1.2;
    letter-spacing:-.4px;
    text-transform:uppercase;
  }

  /* 4. video */
  .video{
    width:100%;
    max-width:min(420px,46vh);
    aspect-ratio:1000/1674;
    background:#000;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video > iframe,
  .video > video,
  .video > vturb-smartplayer{width:100%;max-width:none;height:100%;border:0;display:block}
  .video .vturb-player-placeholder{padding-top:0!important;height:100%}
  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    pointer-events:none;
  }
  .placeholder svg{width:64px;height:64px;fill:#fff;opacity:.5}
  .placeholder span{font-size:12px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

  /* 5. area reservada para os botoes de checkout */
  .checkout-buttons-area{
    width:100%;
    max-width:800px;
    min-height:120px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  /* tablet */
  @media (min-width:768px){
    .page{gap:24px;padding:28px 16px 48px}
    h1{font-size:34px}
    .video{max-width:min(420px,46vh)}
  }
  /* desktop */
  @media (min-width:1025px){
    h1{font-size:38px}
    .video{max-width:min(420px,40vh)}
  }

  /* area do checkout */
  .checkout-buttons-area{gap:0}
  .checkout-buttons-area button{transition:background-color .18s ease,transform .18s ease}
  .checkout-buttons-area button:hover{background-color:#046b2c}
  .checkout-buttons-area button:active{transform:scale(.98)}
  .no-thanks{
    display:block;
    margin:22px auto 0;
    padding:10px 14px;
    background:none;
    border:0;
    font-family:inherit;
    font-size:14px;
    font-weight:400;
    color:#ffffff;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-thickness:1px;
    text-align:center;
    cursor:pointer;
    opacity:.75;
    transition:opacity .18s ease;
  }
  .no-thanks:hover,.no-thanks:focus-visible{opacity:1}
</style>
